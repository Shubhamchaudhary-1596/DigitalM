name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

jobs:
  frontend-and-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [my-project, admin, server]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm install
      - if: matrix.project != 'server'
        run: npm run lint
      - if: matrix.project != 'server'
        run: npm run build
      - if: matrix.project == 'server'
        run: npm test
