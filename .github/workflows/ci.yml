name: CI

on:
  push:
    branches: [main, "audit/**"]
  pull_request:
    branches: [main]

jobs:
  repository-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unresolved merge markers
        run: |
          if git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- ':!package-lock.json'; then
            echo 'Unresolved merge-conflict markers found.'
            exit 1
          fi
      - name: Reject committed dependency directories
        run: |
          if git ls-files | grep -E '(^|/)node_modules/'; then
            echo 'node_modules must not be committed.'
            exit 1
          fi

  frontend-and-api:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [my-project, admin, server]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Export reconciled package lockfile
        uses: actions/upload-artifact@v4
        with:
          name: lockfile-${{ matrix.project }}
          path: ${{ matrix.project }}/package-lock.json
          if-no-files-found: error
          retention-days: 1
      - name: Report dependency advisories
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node -e 'const a=require("/tmp/npm-audit.json"); console.log(JSON.stringify({vulnerabilities:a.metadata?.vulnerabilities, packages:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable}))}, null, 2))'
      - name: Fail on high or critical advisories
        run: npm audit --audit-level=high
      - if: matrix.project != 'server'
        run: npm run lint
      - if: matrix.project != 'server'
        run: npm run build
      - if: matrix.project == 'server'
        run: npm test

  sync-lockfiles:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/audit/')
    needs: frontend-and-api
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          pattern: lockfile-*
          path: lockfiles
          merge-multiple: false
      - name: Update committed lockfiles
        run: |
          cp lockfiles/lockfile-my-project/package-lock.json my-project/package-lock.json
          cp lockfiles/lockfile-admin/package-lock.json admin/package-lock.json
          cp lockfiles/lockfile-server/package-lock.json server/package-lock.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add my-project/package-lock.json admin/package-lock.json server/package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfiles already match the package manifests."
            exit 0
          fi
          git commit -m "Sync npm lockfiles after dependency reconciliation"
          git push origin "HEAD:${{ github.ref_name }}"
